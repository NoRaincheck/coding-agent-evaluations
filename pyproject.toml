[project]
name = "coding-agent-evaluations"
version = "0.1.0"
description = "Cross-harness evaluation of OpenAI-compatible models on SWE-bench Verified and Terminal-Bench 2 Verified"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "NoRaincheck", email = "2498638+NoRaincheck@users.noreply.github.com" }
]
dependencies = [
    "agentsview>=0.44.0",
    # FrogNano's Leaf harness and dataset sources are vendored under
    # src/coding_agent_evaluations/_vendor/frognano at commit 7077a19, not
    # installed as a dependency. See the README's provenance section.
    "openai>=2.0",
    "PyYAML>=6.0",
    # Matrix runs draw a progress bar over the task-seed pairs.
    "tqdm>=4.66",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
cae = "coding_agent_evaluations.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is not a package; the matrix helpers it shares are imported as top-level modules,
# so the directory has to be importable.
pythonpath = ["tests"]

[tool.ruff]
# Vendored third-party code is kept as close to upstream as possible, so it is
# neither linted nor reformatted here. Divergences are marked in-file.
extend-exclude = ["src/coding_agent_evaluations/_vendor"]
