# pi CLI driven headless in the task workspace.
#
# pi owns its system prompt and its tool set (read, bash, edit, write) and
# manages its own context. Each run gets a private agent directory, so the
# machine's global pi configuration, extensions and credentials are not visible.
extends: [../base.yaml]

output_dir: ${EVAL_OUTPUT_ROOT:-eval-results}/swebench-verified/pi

harness:
  name: pi
  options:
    binary: ""
    thinking: medium
    tools: [read, bash, edit, write]
    # Load the vendored pi-token-stats extension and record time-to-first-token, decode and
    # prefill throughput per assistant message. It is an observer only — no prompt, tool or
    # sampling setting changes — and the entries land in the trajectory as `token_stats` and
    # are rolled up into `summary.json`. Set to false to run pi exactly as shipped.
    token_stats: true